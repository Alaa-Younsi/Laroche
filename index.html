<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Paint in the visitor's saved theme/language BEFORE React mounts, so a
         returning light-mode / Arabic user never sees a dark/LTR flash. Kept
         tiny and dependency-free; failures are swallowed. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("laroche-theme");
          document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
          var l = localStorage.getItem("laroche-lang") === "ar" ? "ar" : "fr";
          document.documentElement.lang = l;
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>

    <!-- Fonts are self-hosted (bundled via @fontsource, see src/main.tsx) -->

    <!-- Supabase serves the catalogue query + product photos on every route -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- landing hero = LCP; start it during HTML parse instead of after the JS bundle.
         href must stay identical to what the carousel renders for its FIRST
         slide (src/lib/heroSlides.ts) or the browser fetches the image twice. -->
    <link rel="preload" as="image" fetchpriority="high" href="/hero-slider/00_Boutique.webp" />

    <title>Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie</title>
    <meta
      name="description"
      content="Laroche Bijoux — bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 69 wilayas, paiement à la livraison, garantie sur chaque pièce."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.larochebijoux.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laroche Bijoux" />
    <meta property="og:title" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe" />
    <meta
      property="og:description"
      content="Bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 69 wilayas, paiement à la livraison."
    />
    <meta property="og:url" content="https://www.larochebijoux.com/" />
    <!-- Scrapers give the preview image a byte budget, not just a pixel one —
         WhatsApp drops thumbnails over ~600 KB, so this stays a flattened JPEG
         (~90 KB) rather than the 1 MB RGBA PNG it was generated from. -->
    <meta property="og:image" content="https://www.larochebijoux.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.larochebijoux.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe" />
    <meta
      name="twitter:description"
      content="Bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 69 wilayas, paiement à la livraison."
    />
    <meta name="twitter:image" content="https://www.larochebijoux.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Laroche Bijoux",
        "url": "https://www.larochebijoux.com/",
        "logo": "https://www.larochebijoux.com/og-image.jpg",
        "image": "https://www.larochebijoux.com/og-image.jpg",
        "description": "Bijouterie & Horlogerie de luxe — argent 925, acier inoxydable, montres et bijoux personnalisés. Livraison dans les 69 wilayas d'Algérie, paiement à la livraison.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery",
        "currenciesAccepted": "DZD",
        "sameAs": [
          "https://www.instagram.com/larochebijoux.officiel",
          "https://www.facebook.com/laroche.bijoux1",
          "https://www.tiktok.com/@laroche.bijoux",
          "https://www.snapchat.com/@laroche.bijoux"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
