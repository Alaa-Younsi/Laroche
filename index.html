<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700&family=Almarai:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- editorial imagery lives on Unsplash; warm the connection before React asks -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- landing hero = LCP; start it during HTML parse instead of after the JS bundle.
         imagesrcset/imagesizes must stay identical to what SmartImage renders for
         HERO_MAIN or the browser fetches the image twice. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="
        https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=400&auto=format&fit=crop 400w,
        https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=700&auto=format&fit=crop 700w,
        https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=900&auto=format&fit=crop 900w,
        https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1000&auto=format&fit=crop 1000w,
        https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=1400&auto=format&fit=crop 1400w"
      imagesizes="(max-width: 768px) 64vw, 24rem"
    />

    <title>Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie</title>
    <meta
      name="description"
      content="Laroche Bijoux — bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 58 wilayas, paiement à la livraison, garantie sur chaque pièce."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://larochebijoux.dz/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laroche Bijoux" />
    <meta property="og:title" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe" />
    <meta
      property="og:description"
      content="Bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 58 wilayas, paiement à la livraison."
    />
    <meta property="og:url" content="https://larochebijoux.dz/" />
    <meta property="og:image" content="https://larochebijoux.dz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Laroche Bijoux" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe" />
    <meta
      name="twitter:description"
      content="Bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 58 wilayas, paiement à la livraison."
    />
    <meta name="twitter:image" content="https://larochebijoux.dz/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Laroche Bijoux",
        "url": "https://larochebijoux.dz/",
        "logo": "https://larochebijoux.dz/og-image.png",
        "description": "Bijouterie & Horlogerie de luxe — argent 925, acier inoxydable, montres et bijoux personnalisés. Livraison dans les 58 wilayas d'Algérie, paiement à la livraison.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
