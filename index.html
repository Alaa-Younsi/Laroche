<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700&family=Almarai:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Supabase serves the catalogue query + product photos on every route -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- landing hero = LCP; start it during HTML parse instead of after the JS bundle.
         href must stay identical to what SmartImage renders for HERO_MAIN
         or the browser fetches the image twice. -->
    <link rel="preload" as="image" fetchpriority="high" href="/images/1785266218128.png" />

    <title>Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie</title>
    <meta
      name="description"
      content="Laroche Bijoux — bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 69 wilayas, paiement à la livraison, garantie sur chaque pièce."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.larochebijoux.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laroche Bijoux" />
    <meta property="og:title" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe" />
    <meta
      property="og:description"
      content="Bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 69 wilayas, paiement à la livraison."
    />
    <meta property="og:url" content="https://www.larochebijoux.com/" />
    <meta property="og:image" content="https://www.larochebijoux.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="ar_DZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe" />
    <meta
      name="twitter:description"
      content="Bijoux en argent 925, acier inoxydable, montres et pièces personnalisées. Livraison dans les 69 wilayas, paiement à la livraison."
    />
    <meta name="twitter:image" content="https://www.larochebijoux.com/og-image.png" />
    <meta name="twitter:image:alt" content="Laroche Bijoux — Bijouterie & Horlogerie de Luxe en Algérie" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Laroche Bijoux",
        "url": "https://www.larochebijoux.com/",
        "logo": "https://www.larochebijoux.com/og-image.png",
        "image": "https://www.larochebijoux.com/og-image.png",
        "description": "Bijouterie & Horlogerie de luxe — argent 925, acier inoxydable, montres et bijoux personnalisés. Livraison dans les 69 wilayas d'Algérie, paiement à la livraison.",
        "areaServed": "Algérie",
        "paymentAccepted": "Cash on delivery",
        "currenciesAccepted": "DZD",
        "sameAs": [
          "https://www.instagram.com/larochebijoux.officiel",
          "https://www.facebook.com/laroche.bijoux1",

  </head>
